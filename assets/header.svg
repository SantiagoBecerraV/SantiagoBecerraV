<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Santiago Becerra</title>
  <desc id="d">Encabezado animado: Santiago Becerra, estudiante de Ingeniería de Software, con tecnologías que rotan y símbolos de código flotando.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#16406B"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9CC9FF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#0D3B7A"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="reveal"><rect x="50" y="95" width="0" height="80"><animate attributeName="width" from="0" to="620" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/></rect></clipPath>
    <clipPath id="round"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Fira Code','Consolas','Courier New',monospace}
    .sym{font-family:'Fira Code','Consolas','Courier New',monospace;font-weight:700;fill:#58A6FF;opacity:.25;animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0);opacity:.18}50%{transform:translateY(-16px);opacity:.45}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .role{opacity:0;font-size:25px;font-weight:600;fill:#7FB8FF}
    .r1{animation:cyc 12s infinite 2.2s}.r2{animation:cyc 12s infinite 5.2s}
    .r3{animation:cyc 12s infinite 8.2s}.r4{animation:cyc 12s infinite 11.2s}
    @keyframes cyc{0%{opacity:0;transform:translateY(14px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
    .chip{animation:bounce 3s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .chip rect{fill:#0D2A4A;stroke:#2F81F7;stroke-width:1.5}
    .chip text{fill:#D6E8FF;font-size:15px;font-weight:600;text-anchor:middle}
    .fadein{opacity:0;animation:fi 1s ease forwards}
    @keyframes fi{to{opacity:1}}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:830px 160px}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- luces de fondo -->
    <circle cx="150" cy="60" r="90" fill="#1F6FEB" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" values="150;320;150" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="270" r="110" fill="#2F81F7" opacity=".3" filter="url(#blur)">
      <animate attributeName="cx" values="880;700;880" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- símbolos de código flotando -->
    <text class="sym" x="620" y="60" font-size="34">{ }</text>
    <text class="sym" x="540" y="290" font-size="30" style="animation-delay:-2s">&lt;/&gt;</text>
    <text class="sym" x="960" y="70" font-size="28" style="animation-delay:-4s">;</text>
    <text class="sym" x="690" y="300" font-size="26" style="animation-delay:-1s">01</text>
    <text class="sym" x="30" y="300" font-size="28" style="animation-delay:-3s">( )</text>
    <text class="sym" x="960" y="300" font-size="26" style="animation-delay:-5s">=&gt;</text>

    <!-- línea de consola -->
    <text class="mono fadein" x="60" y="68" font-size="18" fill="#8FB8E8" style="animation-delay:.1s">&gt; hola_mundo()<tspan class="cursor" fill="#58A6FF">▍</tspan></text>

    <!-- nombre con revelado -->
    <g clip-path="url(#reveal)">
      <text x="58" y="158" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="1">Santiago Becerra</text>
    </g>

    <!-- roles que rotan -->
    <text class="role r1" x="60" y="205">Estudiante de Ingeniería de Software</text>
    <text class="role r2" x="60" y="205">Automatizo procesos con n8n + IA</text>
    <text class="role r3" x="60" y="205">Construyo interfaces con JavaScript</text>
    <text class="role r4" x="60" y="205">Diseño bases de datos en MySQL y PostgreSQL</text>

    <!-- chips -->
    <g class="chip" style="animation-delay:0s"><rect x="60" y="238" width="112" height="34" rx="17"/><text x="116" y="260">JavaScript</text></g>
    <g class="chip" style="animation-delay:.25s"><rect x="184" y="238" width="88" height="34" rx="17"/><text x="228" y="260">Python</text></g>
    <g class="chip" style="animation-delay:.5s"><rect x="284" y="238" width="68" height="34" rx="17"/><text x="318" y="260">Java</text></g>
    <g class="chip" style="animation-delay:.75s"><rect x="364" y="238" width="68" height="34" rx="17"/><text x="398" y="260">n8n</text></g>
    <g class="chip" style="animation-delay:1s"><rect x="444" y="238" width="82" height="34" rx="17"/><text x="485" y="260">MySQL</text></g>

    <!-- órbitas + monograma -->
    <g class="pulse">
      <circle cx="830" cy="160" r="52" fill="url(#core)" stroke="#9CC9FF" stroke-width="2"/>
      <text x="830" y="175" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle">SB</text>
    </g>
    <g>
      <circle cx="830" cy="160" r="82" fill="none" stroke="#58A6FF" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 8"/>
      <circle cx="912" cy="160" r="7" fill="#58A6FF"/>
      <circle cx="772" cy="218" r="5" fill="#9CC9FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 830 160" to="360 830 160" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="830" cy="160" r="112" fill="none" stroke="#2F81F7" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="2 10"/>
      <circle cx="830" cy="48" r="6" fill="#7FB8FF"/>
      <circle cx="741" cy="228" r="4" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="rotate" from="360 830 160" to="0 830 160" dur="22s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
